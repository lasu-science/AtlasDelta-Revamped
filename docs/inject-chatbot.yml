name: Inject Chatbot Widget

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Inyectar chatbot-widget.js en todos los HTML
        run: |
          find . -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" | while read file; do
            if ! grep -q "chatbot-widget.js" "$file"; then
              sed -i 's|</body>|  <script src="/chatbot-widget.js"></script>\n</body>|I' "$file"
              echo "✅ Inyectado en: $file"
            else
              echo "⏭️  Ya presente en: $file"
            fi
          done

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: inject chatbot-widget into HTML pages"
          git push
